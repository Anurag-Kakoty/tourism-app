# ---------APPLICATION---------

spring.application.name=backend

# ---------POSTGRESQL---------

spring.datasource.url=jdbc:postgresql://localhost:5432/tourism_db
spring.datasource.username=postgres
spring.datasource.password=harith

# ---------JPA & HIBERNATE---------

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------LOGGING---------

# Show application logs at INFO level
logging.level.com.tourism.backend=INFO

# Reduce Spring framework logging
logging.level.org.springframework=WARN

# Reduce Hibernate SQL logging
logging.level.org.hibernate=WARN


# ---------Server---------

server.port=8080

# ---------Swagger/OpenAPI---------

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true

